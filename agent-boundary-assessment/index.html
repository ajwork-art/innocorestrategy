<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Agent Governance Evaluator — Innocore Strategy &amp; Solutions</title>
  <meta name="description" content="Assess whether a production AI agent meets minimum governance and release-readiness requirements before launch." />
  <meta property="og:title" content="AI Agent Governance Evaluator — Innocore Strategy" />
  <meta property="og:description" content="A structured readiness assessment for enterprise AI agents across 8 governance boundaries." />
  <meta property="og:type" content="website" />

  <!-- Fonts — identical to main site -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <!-- React 18 + Babel (CDN for static site) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Chart.js for radar chart -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <style>
    /* ============================================================
       DESIGN TOKENS — exact match to innocorestrategy main site
    ============================================================ */
    :root {
      --navy:       #0B1F3B;
      --navy-mid:   #112847;
      --gold:       #C9A84C;
      --gold-dark:  #A8893F;
      --gold-faint: #FDF8EC;
      --gold-light: #F5EDD3;
      --text:       #1E293B;
      --muted:      #475569;
      --subtle:     #98A2B3;
      --bg-gray:    #F5F7FA;
      --off-white:  #FAFBFC;
      --border:     #E2E8F0;
      --white:      #FFFFFF;
      --radius:     6px;
      --radius-lg:  12px;
      --shadow-sm:  0 1px 3px rgba(11,31,59,0.06), 0 1px 2px rgba(11,31,59,0.04);
      --shadow-md:  0 4px 16px rgba(11,31,59,0.09), 0 2px 4px rgba(11,31,59,0.05);
      --shadow-lg:  0 12px 32px rgba(11,31,59,0.12), 0 4px 8px rgba(11,31,59,0.06);
      --transition: color 180ms cubic-bezier(0.4,0,0.2,1),
                    border-color 180ms cubic-bezier(0.4,0,0.2,1),
                    background 180ms cubic-bezier(0.4,0,0.2,1),
                    opacity 180ms cubic-bezier(0.4,0,0.2,1),
                    box-shadow 180ms cubic-bezier(0.4,0,0.2,1);
    }

    /* ============================================================
       RESET & BASE
    ============================================================ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      font-size: 1rem;
      line-height: 1.6;
      color: var(--text);
      background: var(--white);
      -webkit-font-smoothing: antialiased;
    }
    img { display: block; max-width: 100%; height: auto; }
    a { text-decoration: none; color: inherit; }
    button { font-family: inherit; cursor: pointer; }

    /* ============================================================
       LAYOUT
    ============================================================ */
    .container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 2.5rem;
    }
    .section     { padding: 5rem 0; }
    .section--sm { padding: 3.5rem 0; }
    .section--xs { padding: 2rem 0; }

    /* ============================================================
       TYPOGRAPHY — exact match to main site classes
    ============================================================ */
    .eyebrow {
      display: block;
      font-family: 'Inter', sans-serif;
      font-size: 0.6875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.13em;
      color: var(--gold);
      margin-bottom: 0.75rem;
    }
    .gold-rule {
      display: block;
      width: 40px;
      height: 3px;
      background: var(--gold);
      margin-bottom: 1.25rem;
      border-radius: 2px;
    }
    h1, h2, h3, h4 {
      font-family: 'Playfair Display', serif;
      letter-spacing: -0.015em;
      color: var(--navy);
      line-height: 1.2;
    }
    .section-heading {
      font-size: clamp(1.75rem, 3.5vw, 2.5rem);
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 1rem;
    }
    .body-prose {
      font-size: 1.0625rem;
      font-weight: 400;
      line-height: 1.82;
      color: var(--muted);
    }

    /* ============================================================
       HEADER — mirrors main site exactly
    ============================================================ */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 100;
      height: 72px;
      background: var(--white);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
    }
    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 2.5rem;
    }
    .logo-link {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-shrink: 0;
    }
    .logo-img {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
    }
    .logo-svg-fallback {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--navy);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .logo-wordmark { display: flex; flex-direction: column; line-height: 1; }
    .logo-wordmark .logo-name {
      font-family: 'Inter', sans-serif;
      font-size: 0.9375rem;
      font-weight: 700;
      color: var(--navy);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .logo-wordmark .logo-sub {
      font-size: 0.625rem;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-top: 2px;
    }
    .header-tool-badge {
      display: flex;
      align-items: center;
      gap: 0.875rem;
    }
    .tool-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.375rem 0.875rem;
      background: var(--gold-faint);
      border: 1px solid var(--gold-light);
      border-radius: 100px;
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gold-dark);
    }
    .tool-badge::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--gold);
      flex-shrink: 0;
    }

    /* ============================================================
       BUTTONS — same as main site
    ============================================================ */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: 'Inter', sans-serif;
      font-size: 0.875rem;
      font-weight: 600;
      padding: 0.625rem 1.5rem;
      border-radius: var(--radius);
      border: 1.5px solid transparent;
      cursor: pointer;
      transition: var(--transition);
      white-space: nowrap;
      line-height: 1;
    }
    .btn-primary { background: var(--gold); color: var(--navy); border-color: var(--gold); }
    .btn-primary:hover { background: var(--gold-dark); border-color: var(--gold-dark); }
    .btn-secondary { background: transparent; color: var(--navy); border-color: #CBD5E1; }
    .btn-secondary:hover { border-color: var(--navy); background: var(--bg-gray); }
    .btn-ghost { background: transparent; color: var(--muted); border-color: transparent; }
    .btn-ghost:hover { color: var(--navy); }
    .btn--sm { padding: 0.5rem 1rem; font-size: 0.8125rem; }
    .btn--lg { padding: 0.875rem 2rem; font-size: 0.9375rem; }

    /* ============================================================
       HERO SECTION
    ============================================================ */
    .page-hero {
      background: var(--white);
      padding: 4rem 0 3.5rem;
      border-bottom: 1px solid var(--border);
    }
    .hero-label {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.375rem 0.875rem;
      background: var(--gold-faint);
      border: 1px solid var(--gold-light);
      border-radius: 4px;
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--gold-dark);
      margin-bottom: 1.5rem;
    }
    .page-hero h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 4.5vw, 3.125rem);
      font-weight: 700;
      color: var(--navy);
      line-height: 1.15;
      letter-spacing: -0.025em;
      margin-bottom: 1.25rem;
      max-width: 720px;
    }
    .page-hero-desc {
      font-size: 1.125rem;
      line-height: 1.78;
      color: var(--muted);
      max-width: 600px;
    }

    /* ============================================================
       FORM ELEMENTS
    ============================================================ */
    .form-label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.5rem;
      letter-spacing: 0.01em;
    }
    .form-input {
      width: 100%;
      padding: 0.625rem 0.875rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-family: 'Inter', sans-serif;
      font-size: 0.9375rem;
      color: var(--text);
      background: var(--white);
      transition: border-color 150ms ease, box-shadow 150ms ease;
      outline: none;
    }
    .form-input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(201,168,76,0.12);
    }
    .form-input:disabled {
      background: var(--bg-gray);
      color: var(--muted);
    }
    textarea.form-input {
      resize: vertical;
      min-height: 110px;
      line-height: 1.65;
    }

    /* ============================================================
       INFO CARD (meta panel, legend panel)
    ============================================================ */
    .info-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.75rem;
      box-shadow: var(--shadow-sm);
    }
    .info-card--gold {
      background: var(--gold-faint);
      border-color: var(--gold-light);
    }

    /* ============================================================
       SCORE SELECTOR
    ============================================================ */
    .score-selector {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 0.375rem;
    }
    .score-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.25rem;
      padding: 0.75rem 0.25rem 0.625rem;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      background: var(--white);
      cursor: pointer;
      transition: var(--transition);
      text-align: center;
    }
    .score-btn:hover {
      border-color: var(--gold);
      background: var(--gold-faint);
    }
    .score-btn.active {
      border-color: var(--navy);
      background: var(--navy);
    }
    .score-btn.active .score-num { color: var(--gold); }
    .score-btn.active .score-lbl { color: rgba(255,255,255,0.65); }
    .score-num {
      font-family: 'Playfair Display', serif;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--navy);
      line-height: 1;
    }
    .score-lbl {
      font-size: 0.5rem;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1.3;
      text-align: center;
    }

    /* ============================================================
       BOUNDARY CARD (evaluation form)
    ============================================================ */
    .boundary-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.75rem;
      box-shadow: var(--shadow-sm);
      transition: box-shadow 180ms ease, border-color 180ms ease;
      position: relative;
    }
    .boundary-card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      border-radius: var(--radius-lg) 0 0 var(--radius-lg);
      background: var(--border);
      transition: background 180ms ease;
    }
    .boundary-card.scored::before { background: var(--gold); }
    .boundary-card.hard-stop::before { background: #dc2626; }
    .boundary-card:hover { box-shadow: var(--shadow-md); }
    .boundary-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 0.375rem;
    }
    .boundary-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.125rem;
      font-weight: 600;
      color: var(--navy);
      line-height: 1.3;
    }
    .weight-badge {
      flex-shrink: 0;
      padding: 0.25rem 0.625rem;
      background: var(--bg-gray);
      border: 1px solid var(--border);
      border-radius: 100px;
      font-size: 0.6875rem;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.04em;
      white-space: nowrap;
    }
    .boundary-desc {
      font-size: 0.875rem;
      color: var(--muted);
      margin-bottom: 1.25rem;
      line-height: 1.65;
    }
    .hardstop-alert {
      display: flex;
      align-items: flex-start;
      gap: 0.625rem;
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: var(--radius);
      font-size: 0.8125rem;
      color: #b91c1c;
      line-height: 1.5;
    }
    .hardstop-alert svg { flex-shrink: 0; margin-top: 1px; }

    /* ============================================================
       SCORING LEGEND (in-form guide)
    ============================================================ */
    .legend-grid {
      display: flex;
      gap: 0;
      flex-wrap: nowrap;
    }
    .legend-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.25rem;
      padding: 0.625rem 0.375rem;
      border-right: 1px solid var(--gold-light);
      text-align: center;
    }
    .legend-item:last-child { border-right: none; }
    .legend-num {
      font-family: 'Playfair Display', serif;
      font-size: 1.125rem;
      font-weight: 700;
      color: var(--navy);
    }
    .legend-lbl {
      font-size: 0.625rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      line-height: 1.3;
    }

    /* ============================================================
       LIVE SCORE STRIP (form footer)
    ============================================================ */
    .score-strip {
      background: var(--navy);
      border-radius: var(--radius-lg);
      padding: 1.5rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
      flex-wrap: wrap;
      margin-top: 2.5rem;
    }
    .score-strip-left {
      display: flex;
      align-items: baseline;
      gap: 1rem;
    }
    .strip-score {
      font-family: 'Playfair Display', serif;
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--gold);
      line-height: 1;
    }
    .strip-score-sub {
      font-size: 0.8125rem;
      color: rgba(255,255,255,0.45);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .strip-status {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.375rem 0.875rem;
      border-radius: 100px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .strip-status::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      flex-shrink: 0;
    }

    /* ============================================================
       REPORT — score panel
    ============================================================ */
    .report-hero {
      background: var(--bg-gray);
      border-bottom: 1px solid var(--border);
      padding: 3rem 0;
    }
    .report-meta-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1.5rem;
      flex-wrap: wrap;
      margin-bottom: 2rem;
    }
    .report-agent-name {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.5rem, 3vw, 2.25rem);
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 0.375rem;
    }
    .report-meta-line {
      font-size: 0.875rem;
      color: var(--muted);
    }

    .score-panel {
      background: var(--navy);
      border-radius: var(--radius-lg);
      padding: 2.5rem 3rem;
      display: grid;
      grid-template-columns: auto 1px 1fr;
      gap: 2.5rem;
      align-items: center;
    }
    .panel-score-col { text-align: center; flex-shrink: 0; }
    .panel-divider { background: rgba(255,255,255,0.1); align-self: stretch; }
    .panel-score-number {
      font-family: 'Playfair Display', serif;
      font-size: 5.5rem;
      font-weight: 700;
      color: var(--gold);
      line-height: 1;
      letter-spacing: -0.03em;
    }
    .panel-score-denom {
      font-size: 1.5rem;
      color: rgba(201,168,76,0.5);
      font-weight: 300;
    }
    .panel-score-caption {
      font-size: 0.6875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: rgba(255,255,255,0.35);
      margin-top: 0.625rem;
    }
    .panel-status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1.125rem;
      border-radius: 100px;
      font-size: 0.875rem;
      font-weight: 700;
      margin-top: 1rem;
    }
    .panel-status-badge::before {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
    }
    .panel-detail-col {}
    .panel-detail-eyebrow {
      font-size: 0.6875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: rgba(255,255,255,0.35);
      margin-bottom: 0.625rem;
    }
    .panel-detail-message {
      font-size: 1rem;
      line-height: 1.72;
      color: rgba(255,255,255,0.82);
    }
    .panel-hard-stop-flag {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 1.25rem;
      padding: 0.625rem 1rem;
      background: rgba(220,38,38,0.18);
      border: 1px solid rgba(220,38,38,0.35);
      border-radius: var(--radius);
      font-size: 0.8125rem;
      font-weight: 600;
      color: #fca5a5;
    }

    /* status colour utilities */
    .status-approved   { background: rgba(22,163,74,0.2);  color: #4ade80; }
    .status-conditional{ background: rgba(202,138,4,0.2);  color: #fbbf24; }
    .status-pilot      { background: rgba(234,88,12,0.2);  color: #fb923c; }
    .status-nolaunuch   { background: rgba(220,38,38,0.2);  color: #f87171; }

    /* ============================================================
       HARD STOP SECTION
    ============================================================ */
    .hardstop-section {
      background: #fff5f5;
      border-top: 1px solid #fecaca;
      border-bottom: 1px solid #fecaca;
      padding: 3rem 0;
    }
    .hardstop-list { display: flex; flex-direction: column; gap: 0.75rem; }
    .hardstop-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.25rem;
      background: var(--white);
      border: 1px solid #fecaca;
      border-left: 4px solid #dc2626;
      border-radius: var(--radius);
    }
    .hardstop-icon {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #fee2e2;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 1rem;
    }
    .hardstop-body strong {
      display: block;
      font-size: 0.9375rem;
      font-weight: 600;
      color: #991b1b;
    }
    .hardstop-body span {
      font-size: 0.8125rem;
      color: #b91c1c;
    }

    /* ============================================================
       BOUNDARY BARS (report)
    ============================================================ */
    .bar-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.875rem 0;
      border-bottom: 1px solid var(--border);
    }
    .bar-row:last-child { border-bottom: none; }
    .bar-name {
      width: 190px;
      flex-shrink: 0;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text);
    }
    .bar-track {
      flex: 1;
      height: 8px;
      background: var(--bg-gray);
      border-radius: 100px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 100px;
      transition: width 700ms cubic-bezier(0.4,0,0.2,1);
    }
    .bar-score {
      width: 44px;
      text-align: right;
      font-size: 0.875rem;
      font-weight: 700;
      color: var(--text);
      flex-shrink: 0;
    }
    .bar-label {
      width: 168px;
      flex-shrink: 0;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .bar-hs-flag {
      font-size: 0.625rem;
      font-weight: 700;
      color: #dc2626;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      flex-shrink: 0;
    }

    /* ============================================================
       POSTURE CARDS (strongest / weakest)
    ============================================================ */
    .posture-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }
    .posture-card {
      border-radius: var(--radius);
      border: 1px solid;
      padding: 1.375rem 1.5rem;
    }
    .posture-card--strength { background: #f0fdf4; border-color: #86efac; }
    .posture-card--weakness { background: #fef2f2; border-color: #fecaca; }
    .posture-card-eyebrow {
      font-size: 0.625rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 1rem;
    }
    .posture-card--strength .posture-card-eyebrow { color: #16a34a; }
    .posture-card--weakness .posture-card-eyebrow { color: #dc2626; }
    .posture-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.5rem 0;
      border-bottom: 1px solid rgba(0,0,0,0.05);
      font-size: 0.875rem;
    }
    .posture-item:last-child { border-bottom: none; }
    .posture-item-name { font-weight: 500; color: var(--text); }
    .posture-item-score { font-weight: 700; font-size: 0.8125rem; }
    .posture-card--strength .posture-item-score { color: #16a34a; }
    .posture-card--weakness .posture-item-score { color: #dc2626; }

    /* ============================================================
       GOVERNANCE PRINCIPLE BAND
    ============================================================ */
    .principle-band {
      background: var(--navy);
      padding: 3.5rem 0;
      text-align: center;
    }
    .principle-band blockquote {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.125rem, 2.25vw, 1.5rem);
      font-style: italic;
      color: rgba(255,255,255,0.88);
      max-width: 680px;
      margin: 0 auto;
      line-height: 1.65;
    }
    .principle-band blockquote em {
      font-style: normal;
      color: var(--gold);
    }
    .principle-band cite {
      display: block;
      font-style: normal;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
      margin-top: 1.25rem;
    }

    /* ============================================================
       FOOTER — mirrors main site
    ============================================================ */
    .site-footer {
      background: var(--navy);
      border-top: 1px solid rgba(255,255,255,0.06);
    }
    .footer-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2rem;
      flex-wrap: wrap;
    }
    .footer-logo { display: flex; align-items: center; gap: 0.75rem; }
    .footer-logo-img {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      opacity: 0.85;
    }
    .footer-logo-text {
      font-family: 'Inter', sans-serif;
      font-size: 0.875rem;
      font-weight: 700;
      color: var(--white);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .footer-copy { font-size: 0.8125rem; color: rgba(255,255,255,0.3); }
    .footer-link {
      font-size: 0.8125rem;
      color: rgba(255,255,255,0.45);
      transition: color 150ms ease;
    }
    .footer-link:hover { color: var(--gold); }

    /* ============================================================
       TOAST NOTIFICATION
    ============================================================ */
    .toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      display: flex;
      align-items: center;
      gap: 0.625rem;
      padding: 0.875rem 1.25rem;
      background: var(--navy);
      color: var(--white);
      border-radius: var(--radius);
      font-size: 0.875rem;
      font-weight: 500;
      box-shadow: var(--shadow-lg);
      z-index: 200;
      animation: toast-in 220ms cubic-bezier(0.4,0,0.2,1);
    }
    @keyframes toast-in {
      from { transform: translateY(1rem); opacity: 0; }
      to   { transform: translateY(0);   opacity: 1; }
    }

    /* ============================================================
       REPORT CHART GRID (bars + radar)
    ============================================================ */
    .report-chart-grid {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 3rem;
      align-items: start;
    }

    /* ============================================================
       SECTION HEADING GROUP
    ============================================================ */
    .shg { margin-bottom: 2rem; }
    .shg .section-heading { margin-bottom: 0.5rem; }
    .shg .body-prose { margin-top: 0.5rem; max-width: 580px; }

    /* ============================================================
       META GRID (evaluation context)
    ============================================================ */
    .meta-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
    .meta-cell {
      padding: 1rem 1.25rem;
      background: var(--bg-gray);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .meta-cell-label {
      font-size: 0.625rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--subtle);
      margin-bottom: 0.375rem;
    }
    .meta-cell-value {
      font-size: 0.9375rem;
      font-weight: 600;
      color: var(--text);
    }

    /* ============================================================
       PRINT STYLES
    ============================================================ */
    @media print {
      .site-header,
      .page-hero,
      .evaluation-section,
      .reset-section,
      .no-print { display: none !important; }
      .principle-band blockquote { color: #000 !important; }
      .panel-detail-message { color: #333 !important; }
      .score-panel {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      body { font-size: 11pt; }
    }

    /* ============================================================
       RESPONSIVE
    ============================================================ */
    @media (max-width: 1024px) {
      .report-chart-grid { grid-template-columns: 1fr; gap: 2rem; }
    }
    @media (max-width: 860px) {
      .score-panel { grid-template-columns: 1fr; padding: 2rem; gap: 1.5rem; }
      .panel-divider { display: none; }
      .score-selector { grid-template-columns: repeat(3, 1fr); }
      .meta-grid { grid-template-columns: 1fr 1fr; }
      .posture-grid { grid-template-columns: 1fr; }
      .bar-label { display: none; }
      .bar-name { width: 140px; }
    }
    @media (max-width: 639px) {
      .container { padding: 0 1.25rem; }
      .header-inner { padding: 0 1.25rem; }
      .section { padding: 3rem 0; }
      .section--sm { padding: 2.25rem 0; }
      .score-selector { grid-template-columns: repeat(2, 1fr); }
      .meta-grid { grid-template-columns: 1fr; }
      .bar-score { display: none; }
      .score-strip { padding: 1.25rem; }
      .score-panel { padding: 1.5rem; }
      .panel-score-number { font-size: 4rem; }
      .footer-inner { flex-direction: column; align-items: flex-start; gap: 1rem; }
    }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
  const { useState, useRef, useEffect } = React;

  /* ============================================================
     DATA — 8 governance boundaries with weights and hard-stop flags
  ============================================================ */
  const BOUNDARIES = [
    {
      key: 'purpose',
      label: 'Purpose',
      weight: 0.10,
      description: 'Defined business purpose and success criteria',
      hardStop: false,
      hardStopLabel: null,
    },
    {
      key: 'ownership',
      label: 'Ownership',
      weight: 0.10,
      description: 'Named domain and technical owners',
      hardStop: true,
      hardStopLabel: 'Named owner',
    },
    {
      key: 'authority',
      label: 'Authority',
      weight: 0.15,
      description: 'Defined actions, human approval, and stop mechanisms',
      hardStop: true,
      hardStopLabel: 'Human override path',
    },
    {
      key: 'data',
      label: 'Data',
      weight: 0.15,
      description: 'Documented data sources, constraints, and privacy',
      hardStop: true,
      hardStopLabel: 'Approved data boundary',
    },
    {
      key: 'evidence',
      label: 'Evidence',
      weight: 0.15,
      description: 'Testing, logs, and traceability records',
      hardStop: true,
      hardStopLabel: 'Logging',
    },
    {
      key: 'lifecycle',
      label: 'Lifecycle',
      weight: 0.10,
      description: 'Versioning, monitoring, and retirement plans',
      hardStop: false,
      hardStopLabel: null,
    },
    {
      key: 'approval',
      label: 'Approval',
      weight: 0.10,
      description: 'Risk-based signoff path',
      hardStop: false,
      hardStopLabel: null,
    },
    {
      key: 'failureAccountability',
      label: 'Failure Accountability',
      weight: 0.15,
      description: 'Incident response, remediation, and failure ownership',
      hardStop: true,
      hardStopLabel: 'Incident response path',
    },
  ];

  const SCORE_LABELS = [
    'Missing',
    'Ad Hoc',
    'Partial',
    'Defined',
    'Implemented',
    'Evidenced & Operating',
  ];

  const INIT_SCORES = BOUNDARIES.reduce((a, b) => ({ ...a, [b.key]: 0 }), {});

  /* ============================================================
     HELPERS
  ============================================================ */
  function calcScore(scores) {
    const raw = BOUNDARIES.reduce((t, b) => t + (scores[b.key] / 5) * b.weight * 100, 0);
    return Math.round(raw * 10) / 10;
  }

  function getStatus(score) {
    if (score >= 85) return { label: 'Approved',             key: 'approved' };
    if (score >= 70) return { label: 'Conditional Approval', key: 'conditional' };
    if (score >= 50) return { label: 'Pilot Only',           key: 'pilot' };
    return              { label: 'No Launch',              key: 'nolaunuch' };
  }

  /* Hard stop = score ≤ 2 (below Defined) on a flagged boundary */
  function getHardStops(scores) {
    return BOUNDARIES.filter(b => b.hardStop && scores[b.key] <= 2);
  }

  function getBarColor(s) {
    return ['#dc2626','#ea580c','#ca8a04','#65a30d','#16a34a','#15803d'][s];
  }

  function getInterpretation(score, statusKey, hardStopCount) {
    if (hardStopCount > 0)
      return `This agent has ${hardStopCount} critical governance gap${hardStopCount > 1 ? 's' : ''} that must be resolved before any deployment decision is made. Hard-stop violations indicate missing foundational controls — these are non-negotiable prerequisites for launch.`;
    if (statusKey === 'approved')
      return 'This agent demonstrates strong governance across all evaluated boundaries. Foundational controls are evidenced and operating. Proceed with standard release protocols and schedule ongoing monitoring reviews.';
    if (statusKey === 'conditional')
      return 'This agent meets the threshold for conditional deployment. Weaker boundaries should be addressed on a defined remediation timeline. A follow-up governance review is recommended within 60 days of launch.';
    if (statusKey === 'pilot')
      return 'This agent is not ready for general deployment. A controlled pilot in a limited, monitored environment may be considered with explicit escalation paths active. Address governance gaps before expanding scope.';
    return 'This agent does not meet minimum governance requirements for deployment in any form. Multiple boundaries are absent or undefined. Halt deployment planning and initiate a governance design sprint.';
  }

  function formatDate() {
    return new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
  }

  /* ============================================================
     HEADER
  ============================================================ */
  function Header() {
    return (
      <header className="site-header">
        <div className="header-inner">
          <a href="/" className="logo-link" aria-label="Innocore Strategy home">
            <img
              src="/assets/images/logo.png"
              alt=""
              className="logo-img"
              onError={e => { e.target.style.display = 'none'; e.target.nextElementSibling.style.display = 'flex'; }}
            />
            <span className="logo-svg-fallback" style={{ display: 'none' }}>
              <svg width="20" height="20" fill="none" viewBox="0 0 24 24">
                <circle cx="12" cy="8" r="4" fill="#C9A84C"/>
                <path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8" stroke="#C9A84C" strokeWidth="1.5" strokeLinecap="round"/>
              </svg>
            </span>
            <span className="logo-wordmark">
              <span className="logo-name">Innocore</span>
              <span className="logo-sub">Strategy &amp; Solutions</span>
            </span>
          </a>
          <div className="header-tool-badge">
            <span className="tool-badge">Agent Governance Evaluator</span>
          </div>
        </div>
      </header>
    );
  }

  /* ============================================================
     FOOTER
  ============================================================ */
  function Footer() {
    return (
      <footer className="site-footer">
        <div className="footer-inner">
          <div className="footer-logo">
            <img
              src="/assets/images/logo.png"
              alt=""
              className="footer-logo-img"
              onError={e => e.target.style.display = 'none'}
            />
            <span className="footer-logo-text">Innocore Strategy</span>
          </div>
          <span className="footer-copy">
            © {new Date().getFullYear()} Innocore Strategy &amp; Solutions LLC. All rights reserved.
          </span>
          <a href="/" className="footer-link">← Back to Site</a>
        </div>
      </footer>
    );
  }

  /* ============================================================
     SCORE SELECTOR
  ============================================================ */
  function ScoreSelector({ value, onChange }) {
    return (
      <div className="score-selector" role="group" aria-label="Score">
        {SCORE_LABELS.map((lbl, i) => (
          <button
            key={i}
            type="button"
            className={`score-btn${value === i ? ' active' : ''}`}
            onClick={() => onChange(i)}
            aria-pressed={value === i}
            title={`${i} — ${lbl}`}
          >
            <span className="score-num">{i}</span>
            <span className="score-lbl">{lbl}</span>
          </button>
        ))}
      </div>
    );
  }

  /* ============================================================
     BOUNDARY CARD
  ============================================================ */
  function BoundaryCard({ boundary, score, onChange }) {
    const isHardStop = boundary.hardStop && score <= 2;
    const hasScore   = score > 0;
    const cls = `boundary-card${isHardStop ? ' hard-stop' : hasScore ? ' scored' : ''}`;

    return (
      <div className={cls}>
        <div className="boundary-header">
          <h3 className="boundary-title">{boundary.label}</h3>
          <span className="weight-badge">{Math.round(boundary.weight * 100)}% weight</span>
        </div>
        <p className="boundary-desc">{boundary.description}</p>
        <ScoreSelector value={score} onChange={onChange} />
        {isHardStop && (
          <div className="hardstop-alert">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
              <circle cx="12" cy="12" r="10"/>
              <line x1="12" y1="8" x2="12" y2="12"/>
              <circle cx="12" cy="16" r="0.5" fill="currentColor"/>
            </svg>
            <span>
              <strong>Hard stop —</strong> {boundary.hardStopLabel} is undefined or insufficient.
              This boundary must reach at least <strong>Defined (3)</strong> before launch.
            </span>
          </div>
        )}
      </div>
    );
  }

  /* ============================================================
     RADAR CHART
  ============================================================ */
  function RadarChart({ scores }) {
    const canvasRef = useRef(null);
    const chartRef  = useRef(null);

    useEffect(() => {
      if (!canvasRef.current) return;
      if (chartRef.current) chartRef.current.destroy();

      chartRef.current = new Chart(canvasRef.current.getContext('2d'), {
        type: 'radar',
        data: {
          labels: BOUNDARIES.map(b => b.label),
          datasets: [{
            data: BOUNDARIES.map(b => scores[b.key]),
            backgroundColor: 'rgba(201,168,76,0.10)',
            borderColor: '#C9A84C',
            borderWidth: 2,
            pointBackgroundColor: '#C9A84C',
            pointBorderColor: '#0B1F3B',
            pointBorderWidth: 2,
            pointRadius: 5,
            pointHoverRadius: 7,
          }],
        },
        options: {
          responsive: true,
          maintainAspectRatio: true,
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: ctx => ` ${SCORE_LABELS[ctx.raw]} (${ctx.raw}/5)`,
              },
            },
          },
          scales: {
            r: {
              min: 0,
              max: 5,
              ticks: { stepSize: 1, display: false },
              grid:        { color: 'rgba(0,0,0,0.07)' },
              angleLines:  { color: 'rgba(0,0,0,0.07)' },
              pointLabels: {
                font: { family: 'Inter', size: 11, weight: '600' },
                color: '#475569',
              },
            },
          },
        },
      });

      return () => { if (chartRef.current) chartRef.current.destroy(); };
    }, []);   /* run once — scores don't change after report renders */

    return (
      <div style={{ maxWidth: 380, margin: '0 auto' }}>
        <canvas ref={canvasRef} />
      </div>
    );
  }

  /* ============================================================
     EVALUATION FORM
  ============================================================ */
  function EvaluationForm({ scores, setScores, agentName, setAgentName,
                             evaluatorName, setEvaluatorName, notes, setNotes,
                             onSubmit }) {
    const liveScore   = calcScore(scores);
    const liveStatus  = getStatus(liveScore);
    const hardStops   = getHardStops(scores);
    const scored      = Object.values(scores).filter(s => s > 0).length;
    const evalDate    = formatDate();

    const statusClass = {
      approved: 'status-approved', conditional: 'status-conditional',
      pilot: 'status-pilot', nolaunuch: 'status-nolaunuch',
    }[liveStatus.key];

    return (
      <>
        {/* HERO */}
        <section className="page-hero">
          <div className="container">
            <div className="hero-label">Agent Governance · Release Readiness</div>
            <h1>AI Agent Governance Evaluator</h1>
            <p className="page-hero-desc">
              Assess whether a production AI agent meets minimum governance and
              release-readiness requirements before launch. Score each of the eight
              boundaries, then generate a structured readiness report.
            </p>
          </div>
        </section>

        {/* FORM BODY */}
        <section className="section evaluation-section">
          <div className="container">

            {/* Evaluation context */}
            <div className="info-card" style={{ marginBottom: '2rem' }}>
              <div className="shg" style={{ marginBottom: '1.25rem' }}>
                <span className="eyebrow">Evaluation Context</span>
                <h2 style={{ fontFamily: 'Playfair Display, serif', fontSize: '1.25rem', fontWeight: 600, color: 'var(--navy)' }}>
                  Agent &amp; Evaluator Information
                </h2>
              </div>
              <div className="meta-grid">
                <div>
                  <label className="form-label" htmlFor="agentName">
                    Agent Name <span style={{ color: 'var(--gold)' }}>*</span>
                  </label>
                  <input
                    id="agentName"
                    className="form-input"
                    type="text"
                    placeholder="e.g. Customer Support Agent v2"
                    value={agentName}
                    onChange={e => setAgentName(e.target.value)}
                  />
                </div>
                <div>
                  <label className="form-label" htmlFor="evaluatorName">Evaluator</label>
                  <input
                    id="evaluatorName"
                    className="form-input"
                    type="text"
                    placeholder="Name or role"
                    value={evaluatorName}
                    onChange={e => setEvaluatorName(e.target.value)}
                  />
                </div>
                <div>
                  <label className="form-label">Evaluation Date</label>
                  <input className="form-input" type="text" value={evalDate} disabled />
                </div>
              </div>
            </div>

            {/* Scoring legend */}
            <div className="info-card info-card--gold" style={{ marginBottom: '2.5rem' }}>
              <span className="eyebrow" style={{ marginBottom: '1rem' }}>Scoring Reference</span>
              <div className="legend-grid">
                {SCORE_LABELS.map((lbl, i) => (
                  <div key={i} className="legend-item">
                    <span className="legend-num">{i}</span>
                    <span className="legend-lbl">{lbl}</span>
                  </div>
                ))}
              </div>
            </div>

            {/* Section heading */}
            <div className="shg">
              <span className="eyebrow">Governance Boundaries</span>
              <h2 className="section-heading">Score Each Boundary</h2>
              <p className="body-prose">
                Select the score that most accurately reflects the current state of each
                governance boundary. Default is 0 for anything not yet defined or documented.
              </p>
              <span className="gold-rule" style={{ marginTop: '1.25rem', marginBottom: 0 }} />
            </div>

            {/* Boundary cards — 2-column auto-fit */}
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(340px, 1fr))', gap: '1.25rem', marginBottom: '2rem' }}>
              {BOUNDARIES.map(b => (
                <BoundaryCard
                  key={b.key}
                  boundary={b}
                  score={scores[b.key]}
                  onChange={val => setScores(prev => ({ ...prev, [b.key]: val }))}
                />
              ))}
            </div>

            {/* Evaluator notes */}
            <div className="info-card" style={{ marginBottom: '2rem' }}>
              <label className="form-label" htmlFor="evalNotes" style={{ marginBottom: '0.25rem' }}>
                Evaluator Notes
              </label>
              <p style={{ fontSize: '0.8125rem', color: 'var(--subtle)', marginBottom: '0.875rem' }}>
                Optional. Record context, known limitations, or remediation priorities.
              </p>
              <textarea
                id="evalNotes"
                className="form-input"
                placeholder="Add context on agent scope, known gaps, risk factors, or planned remediation..."
                value={notes}
                onChange={e => setNotes(e.target.value)}
              />
            </div>

            {/* Live score strip + CTA */}
            <div className="score-strip">
              <div className="score-strip-left">
                <span className="strip-score">{liveScore}</span>
                <span className="strip-score-sub">/ 100 · {scored}/8 scored</span>
              </div>
              <div style={{ display: 'flex', alignItems: 'center', gap: '1rem', flexWrap: 'wrap' }}>
                {scored > 0 && (
                  <span className={`strip-status ${statusClass}`}>{liveStatus.label}</span>
                )}
                {hardStops.length > 0 && (
                  <span style={{ fontSize: '0.8125rem', color: '#fca5a5', fontWeight: 600 }}>
                    {hardStops.length} hard stop{hardStops.length > 1 ? 's' : ''} active
                  </span>
                )}
                <button className="btn btn-primary btn--lg" onClick={onSubmit}>
                  Generate Readiness Report →
                </button>
              </div>
            </div>
          </div>
        </section>

        {/* Principle */}
        <div className="principle-band">
          <div className="container">
            <blockquote>
              "<em>No owner, no launch.</em> No boundary, no autonomy. <em>No evidence, no trust.</em>"
              <cite>Innocore Governance Principle</cite>
            </blockquote>
          </div>
        </div>
      </>
    );
  }

  /* ============================================================
     REPORT
  ============================================================ */
  function Report({ scores, agentName, evaluatorName, notes, onReset }) {
    const [copied, setCopied] = useState(false);
    const evalDate  = formatDate();
    const score     = calcScore(scores);
    const status    = getStatus(score);
    const hardStops = getHardStops(scores);
    const interp    = getInterpretation(score, status.key, hardStops.length);

    const sorted    = [...BOUNDARIES].sort((a, b) => scores[b.key] - scores[a.key]);
    const strongest = sorted.slice(0, 3);
    const weakest   = sorted.slice(-3).reverse();

    const statusClass = {
      approved: 'status-approved', conditional: 'status-conditional',
      pilot: 'status-pilot', nolaunuch: 'status-nolaunuch',
    }[status.key];

    function handleCopy() {
      const lines = [
        'AI AGENT GOVERNANCE EVALUATION REPORT',
        '═'.repeat(44),
        `Agent:         ${agentName || 'Unnamed Agent'}`,
        `Evaluator:     ${evaluatorName || 'Not specified'}`,
        `Date:          ${evalDate}`,
        '',
        `OVERALL SCORE: ${score} / 100`,
        `LAUNCH STATUS: ${status.label}`,
        '',
        'BOUNDARY SCORES:',
        ...BOUNDARIES.map(b =>
          `  ${b.label.padEnd(26)} ${scores[b.key]}/5   ${SCORE_LABELS[scores[b.key]]}`
        ),
        '',
        hardStops.length > 0
          ? `HARD STOPS (${hardStops.length} — deployment blocked):`
          : 'HARD STOPS: None',
        ...hardStops.map(b =>
          `  ✗  ${b.hardStopLabel}  —  ${b.label} boundary scored ${scores[b.key]}/5`
        ),
        '',
        'ASSESSMENT:',
        interp,
        '',
        notes ? `EVALUATOR NOTES:\n${notes}` : '',
        '',
        '─'.repeat(44),
        '"No owner, no launch. No boundary, no autonomy. No evidence, no trust."',
        'Innocore Strategy & Solutions LLC — innocorestrategy.com',
      ].filter(l => l !== undefined).join('\n');

      navigator.clipboard.writeText(lines).then(() => {
        setCopied(true);
        setTimeout(() => setCopied(false), 2800);
      });
    }

    return (
      <>
        {/* REPORT HERO */}
        <section className="report-hero">
          <div className="container">
            <div className="report-meta-row">
              <div>
                <span className="eyebrow">Readiness Report</span>
                <h1 className="report-agent-name">{agentName || 'Unnamed Agent'}</h1>
                <p className="report-meta-line">
                  Evaluated by {evaluatorName || 'Unspecified evaluator'} &nbsp;·&nbsp; {evalDate}
                </p>
              </div>
              <div style={{ display: 'flex', gap: '0.625rem', flexWrap: 'wrap', alignItems: 'flex-start' }} className="no-print">
                <button className="btn btn-secondary btn--sm" onClick={handleCopy}>
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
                  </svg>
                  {copied ? 'Copied!' : 'Copy Report'}
                </button>
                <button className="btn btn-secondary btn--sm" onClick={() => window.print()}>
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <polyline points="6 9 6 2 18 2 18 9"/>
                    <path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/>
                    <rect x="6" y="14" width="12" height="8"/>
                  </svg>
                  Print
                </button>
                <button className="btn btn-primary btn--sm" onClick={onReset}>
                  New Evaluation
                </button>
              </div>
            </div>

            {/* Score panel */}
            <div className="score-panel">
              {/* Left — number */}
              <div className="panel-score-col">
                <div className="panel-score-number">
                  {score}<span className="panel-score-denom">/100</span>
                </div>
                <div className="panel-score-caption">Weighted Score</div>
                <div style={{ marginTop: '1rem' }}>
                  <span className={`panel-status-badge ${statusClass}`}>{status.label}</span>
                </div>
              </div>

              {/* Divider */}
              <div className="panel-divider" />

              {/* Right — interpretation */}
              <div className="panel-detail-col">
                <div className="panel-detail-eyebrow">Assessment Summary</div>
                <p className="panel-detail-message">{interp}</p>
                {hardStops.length > 0 && (
                  <div className="panel-hard-stop-flag">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
                      <circle cx="12" cy="12" r="10"/>
                      <line x1="12" y1="8" x2="12" y2="12"/>
                      <circle cx="12" cy="16" r="0.5" fill="currentColor"/>
                    </svg>
                    {hardStops.length} hard stop{hardStops.length > 1 ? 's' : ''} identified — deployment is blocked until resolved
                  </div>
                )}
              </div>
            </div>
          </div>
        </section>

        {/* HARD STOPS */}
        {hardStops.length > 0 && (
          <section className="hardstop-section">
            <div className="container">
              <div className="shg">
                <span className="eyebrow" style={{ color: '#dc2626' }}>Critical Findings</span>
                <h2 className="section-heading" style={{ color: '#991b1b' }}>Hard Stop Violations</h2>
                <p className="body-prose">
                  These governance controls are absent or insufficient. Each represents a
                  non-negotiable launch prerequisite that cannot be waived.
                </p>
              </div>
              <div className="hardstop-list">
                {hardStops.map(b => (
                  <div key={b.key} className="hardstop-row">
                    <div className="hardstop-icon">⛔</div>
                    <div className="hardstop-body">
                      <strong>{b.hardStopLabel} — {b.label} Boundary</strong>
                      <span>
                        Current score: {scores[b.key]}/5 ({SCORE_LABELS[scores[b.key]]})
                        &nbsp;·&nbsp; Minimum required: 3 (Defined)
                      </span>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </section>
        )}

        {/* BOUNDARY SCORES + RADAR */}
        <section className="section--sm" style={{ borderBottom: '1px solid var(--border)' }}>
          <div className="container">
            <div className="report-chart-grid">
              {/* Bar chart */}
              <div>
                <div className="shg">
                  <span className="eyebrow">Boundary Analysis</span>
                  <h2 className="section-heading">Governance Scores</h2>
                </div>
                {BOUNDARIES.map(b => {
                  const pct = (scores[b.key] / 5) * 100;
                  const hs  = b.hardStop && scores[b.key] <= 2;
                  return (
                    <div key={b.key} className="bar-row">
                      <div className="bar-name">{b.label}</div>
                      <div className="bar-track">
                        <div className="bar-fill" style={{ width: `${pct}%`, background: getBarColor(scores[b.key]) }} />
                      </div>
                      <div className="bar-score">{scores[b.key]}/5</div>
                      <div className="bar-label">{SCORE_LABELS[scores[b.key]]}</div>
                      {hs && <div className="bar-hs-flag">Hard stop</div>}
                    </div>
                  );
                })}
              </div>

              {/* Radar */}
              <div>
                <div className="shg">
                  <span className="eyebrow">Governance Profile</span>
                  <h2 className="section-heading" style={{ fontSize: '1.375rem' }}>Boundary Radar</h2>
                </div>
                <RadarChart scores={scores} />
              </div>
            </div>
          </div>
        </section>

        {/* STRENGTHS & GAPS */}
        <section className="section--sm" style={{ background: 'var(--bg-gray)', borderBottom: '1px solid var(--border)' }}>
          <div className="container">
            <div className="shg">
              <span className="eyebrow">Governance Posture</span>
              <h2 className="section-heading">Strengths &amp; Gaps</h2>
            </div>
            <div className="posture-grid">
              <div className="posture-card posture-card--strength">
                <div className="posture-card-eyebrow">Strongest Boundaries</div>
                {strongest.map(b => (
                  <div key={b.key} className="posture-item">
                    <span className="posture-item-name">{b.label}</span>
                    <span className="posture-item-score">{scores[b.key]}/5 — {SCORE_LABELS[scores[b.key]]}</span>
                  </div>
                ))}
              </div>
              <div className="posture-card posture-card--weakness">
                <div className="posture-card-eyebrow">Weakest Boundaries</div>
                {weakest.map(b => (
                  <div key={b.key} className="posture-item">
                    <span className="posture-item-name">{b.label}</span>
                    <span className="posture-item-score">{scores[b.key]}/5 — {SCORE_LABELS[scores[b.key]]}</span>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </section>

        {/* EVALUATOR NOTES */}
        {notes.trim() && (
          <section className="section--sm" style={{ borderBottom: '1px solid var(--border)' }}>
            <div className="container">
              <div className="shg">
                <span className="eyebrow">Evaluator Commentary</span>
                <h2 className="section-heading" style={{ fontSize: '1.375rem' }}>Assessment Notes</h2>
              </div>
              <div style={{
                padding: '1.5rem 1.75rem',
                background: 'var(--gold-faint)',
                border: '1px solid var(--gold-light)',
                borderRadius: 'var(--radius-lg)',
                fontSize: '1rem',
                lineHeight: 1.78,
                color: 'var(--text)',
                whiteSpace: 'pre-wrap',
              }}>
                {notes}
              </div>
            </div>
          </section>
        )}

        {/* PRINCIPLE */}
        <div className="principle-band">
          <div className="container">
            <blockquote>
              "<em>No owner, no launch.</em> No boundary, no autonomy. <em>No evidence, no trust.</em>"
              <cite>Innocore Governance Principle</cite>
            </blockquote>
          </div>
        </div>

        {/* RESET CTA */}
        <section className="section--xs reset-section no-print" style={{ textAlign: 'center', borderTop: '1px solid var(--border)' }}>
          <div className="container">
            <p style={{ fontSize: '0.9375rem', color: 'var(--muted)', marginBottom: '1.25rem' }}>
              Ready to assess another agent?
            </p>
            <button className="btn btn-primary btn--lg" onClick={onReset}>
              Start New Evaluation
            </button>
          </div>
        </section>

        {/* TOAST */}
        {copied && (
          <div className="toast">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
            Report summary copied to clipboard
          </div>
        )}
      </>
    );
  }

  /* ============================================================
     APP ROOT
  ============================================================ */
  function App() {
    const [view,          setView]          = useState('form');
    const [scores,        setScores]        = useState(INIT_SCORES);
    const [agentName,     setAgentName]     = useState('');
    const [evaluatorName, setEvaluatorName] = useState('');
    const [notes,         setNotes]         = useState('');

    function handleSubmit() {
      setView('report');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function handleReset() {
      setView('form');
      setScores(INIT_SCORES);
      setAgentName('');
      setEvaluatorName('');
      setNotes('');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    return (
      <>
        <Header />
        {view === 'form' ? (
          <EvaluationForm
            scores={scores}
            setScores={setScores}
            agentName={agentName}
            setAgentName={setAgentName}
            evaluatorName={evaluatorName}
            setEvaluatorName={setEvaluatorName}
            notes={notes}
            setNotes={setNotes}
            onSubmit={handleSubmit}
          />
        ) : (
          <Report
            scores={scores}
            agentName={agentName}
            evaluatorName={evaluatorName}
            notes={notes}
            onReset={handleReset}
          />
        )}
        <Footer />
      </>
    );
  }

  /* Render */
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
